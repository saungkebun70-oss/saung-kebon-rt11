.sidebar-header h2 .logo-icon svg{width:20px;height:20px;color:#fff}

.menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:all .15s;border-radius:10px;min-height:44px}
.menu-item:hover{background:var(--pt2);color:var(--ink)}
.menu-item.active{background:var(--pt);color:var(--pdd);border-right:3px solid var(--p)}
.menu-item .icon-wrap{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

.finance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.empty{text-align:center;padding:46px 20px;color:var(--muted2)}

.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-130px);background:var(--pd);color:#fff;padding:14px 24px;border-radius:13px;font-size:14px;font-weight:700;z-index:4000;opacity:0;transition:all .4s;box-shadow:0 14px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}.toast.info{background:var(--blue)}

.page{display:none}

  .hamburger{display:none!important}
  .sidebar-overlay{display:none!important}
}
</style>

let appData,currentUser=null,currentPage='home',firebaseListener=null;

const tglPendek=s=>{if(!s)return'-';const d=new Date(s);return isNaN(d)?s:d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+d.getFullYear();};

const today=()=>new Date().toISOString().split('T')[0];
const bulanIni=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const labelBulan=k=>{if(!k)return'-';const[y,m]=k.split('-');return BULAN[+m-1]+' '+y;};

const openModal=h=>{$('modalContent').innerHTML=h;$('modal').classList.add('active');};

function updateSyncStatus(online){const ss=$('syncStatus');if(online){$('syncText').textContent='Online · Tersimpan di Firebase';}else{ss.querySelector('.dot').style.background='var(--red)';$('syncText').textContent='Offline · Cache lokal';}}
async function loadDataFromFirebase(){try{const snapshot=await db.ref('/').once('value');const data=snapshot.val();if(data&&data.warga&&data.warga.length){appData=data;showToast('Data dimuat dari Firebase','info');}else{await db.ref('/').set(defaultData);appData=JSON.parse(JSON.stringify(defaultData));showToast('Data default dibuat di Firebase','info');}updateSyncStatus(true);}catch(e){console.error('Firebase load error:',e);try{const local=localStorage.getItem('saungkebon_cache');if(local){appData=JSON.parse(local);showToast('Menggunakan cache lokal','info');}else{appData=JSON.parse(JSON.stringify(defaultData));}}catch(e2){appData=JSON.parse(JSON.stringify(defaultData));}updateSyncStatus(false);}}
async function saveDataToFirebase(){try{await db.ref('/').set(appData);localStorage.setItem('saungkebon_cache',JSON.stringify(appData));updateSyncStatus(true);return true;}catch(e){console.error('Firebase save error:',e);localStorage.setItem('saungkebon_cache',JSON.stringify(appData));updateSyncStatus(false);showToast('Disimpan di cache lokal','info');return false;}}
function setupRealtimeListener(){if(firebaseListener)db.ref('/').off('value',firebaseListener);firebaseListener=db.ref('/').on('value',snapshot=>{const data=snapshot.val();if(data&&currentUser){const before=JSON.stringify(appData);appData=data;normalize();if(JSON.stringify(appData)!==before){showToast('Data diperbarui dari server','info');refreshPage();}}},error=>{console.error('Firebase listener error:',error);updateSyncStatus(false);});}

function doLogin(){const id=$('loginWarga').value,pin=$('loginPin').value.trim();if(!id)return showToast('Pilih akun','error');if(!/^\d{4}$/.test(pin))return showToast('PIN 4 digit','error');const w=appData.warga.find(x=>x.id===id);if(!w)return showToast('Akun tidak ada','error');if(pin!==(w.pin||'1234'))return showToast('PIN salah!','error');currentUser=w;if($('rememberMe').checked)localStorage.setItem('rtku_sess',JSON.stringify({id:w.id,t:Date.now(),p:currentPage}));enterApp();showToast('Selamat datang, '+w.nama.split(' ')[0]+'!');}

function doLogout(){if(!confirm('Yakin keluar?'))return;currentUser=null;if(firebaseListener)db.ref('/').off('value',firebaseListener);localStorage.removeItem('rtku_sess');$('loginPage').style.display='flex';$('app').style.display='none';$('loginPin').value='';closeSidebar();}

function buildSidebarMenu(){
  let html='';
  NAV.forEach(n=>{
    html+=`<div class="menu-item" data-page="${n.id}" onclick="showPage('${n.id}')"><span class="icon-wrap" style="font-size:20px">${n.i}</span><span>${n.l}</span></div>`;
  });
  html+=`<div class="menu-item logout-item" onclick="doLogout()"><span class="icon-wrap" style="font-size:20px"></span><span>Keluar</span></div>`;
  $('sidebarMenu').innerHTML=html;
}

function showPage(p){
  if(!PAGES.includes(p))p='home';
  currentPage=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  const t=$('page-'+p);
  if(t)t.classList.add('active');
  document.querySelectorAll('.menu-item').forEach(m=>m.classList.toggle('active',m.dataset.page===p));
  refreshPage();
  window.scrollTo({top:0});
  closeSidebar();
}

function refreshPage(){
  updateDashboard();
  if(currentPage==='home')renderDashboard();
  else if(currentPage==='warga')renderWargaList();
  else if(currentPage==='iuran'){buildIuranBulan();renderIuranList();}
  else if(currentPage==='keuangan'){buildKasBulan();applyFilter();renderLPJ();}
  else if(currentPage==='setoran'){buildSetorBulan();renderSetoran();}
  else if(currentPage==='pengumuman')renderPengumuman();
  else if(currentPage==='kegiatan')renderKegiatanList();
  else if(currentPage==='pengaduan')renderPengaduan();
  else if(currentPage==='ronda')renderRonda();
  else if(currentPage==='surat')renderSurat();
  else if(currentPage==='tamu')renderTamu();
  else if(currentPage==='voting')renderVoting();
  else if(currentPage==='akun')renderAkun();
}

function updateDashboard(){
  const kas=appData.kas||[];
  const b=bulanIni();
  const ln=(appData.iuran||[]).filter(i=>i.bulan===b&&i.status==='Lunas').length;
  const tt=(appData.warga||[]).length;
  const pc=tt?Math.round(ln/tt*100):0;
  const p=(appData.pengumuman||[]).find(x=>x.pin)||(appData.pengumuman||[])[0];
  const c=(appData.lapor||[]).filter(l=>l.status==='Baru').length+(isStaff()?(appData.setoran||[]).filter(s=>s.status==='Pending').length:0);
  const bd=$('notifBadge');bd.textContent=c;bd.classList.toggle('show',c>0);
}

  const b=bulanIni();
  const ln=(appData.iuran||[]).filter(i=>i.bulan===b&&i.status==='Lunas').length;
  const tt=(appData.warga||[]).length;
  const pc=tt?Math.round(ln/tt*100):0;
  const pinned=(appData.pengumuman||[]).find(x=>x.pin)||(appData.pengumuman||[])[0];
  
  let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px"><div style="flex:1"><span class="badge b-purple">${esc(pinned?.kat||'Pengumuman')}</span><h2 style="font-size:20px;font-weight:800;margin:10px 0">${esc(pinned?.judul||'—')}</h2><p style="font-size:14px;color:#6B7280;line-height:1.6;margin-bottom:12px">${esc(pinned?.isi||'—')}</p><div style="font-size:12px;color:#9CA3AF;font-weight:600">${pinned?' '+tglIndo(pinned.tgl)+(pinned.oleh?' · 👤 '+esc(pinned.oleh):''):'—'}</div></div><div style="opacity:.18;font-size:52px">📢</div></div><div style="display:flex;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)"><button class="btn btn-sm btn-warning" onclick="showAnnouncementDetail()">Lihat Detail →</button></div></div>`;
  
  if(isStaffUser){
    html+=`<div class="card"><div class="card-header"><h3>💰 Ringkasan Keuangan</h3><span class="link" onclick="showPage('keuangan')">Laporan →</span></div><div class="finance-grid"><div class="finance-item green"><div class="label">Saldo Kas</div><div class="value">${rp(sal)}</div></div><div class="finance-item blue"><div class="label">Pemasukan</div><div class="value">${rp(mk)}</div></div><div class="finance-item orange"><div class="label">Pengeluaran</div><div class="value">${rp(kl)}</div></div></div></div>`;
  }
  
  html+=`<div class="card"><div class="card-header"><h3>👥 Statistik Warga</h3></div><div class="finance-grid"><div class="finance-item purple"><div class="label">Total Warga</div><div class="value">${(appData.warga||[]).length}</div></div><div class="finance-item green"><div class="label">Iuran Lunas</div><div class="value">${ln}/${tt}</div></div><div class="finance-item red"><div class="label">Pengaduan Aktif</div><div class="value">${(appData.lapor||[]).filter(l=>l.status!=='Selesai'&&l.status!=='Ditolak').length}</div></div></div><div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px"><span>Progress Iuran Bulan Ini</span><span>${pc}%</span></div><div class="progress"><div style="width:${pc}%"></div></div></div></div>`;
  
  const kegiatanTerdekat=(appData.kegiatan||[]).filter(k=>k.status==='Akan Datang').slice(0,3);
  if(kegiatanTerdekat.length){
    html+=`<div class="card"><div class="card-header"><h3>📅 Kegiatan Mendatang</h3><span class="link" onclick="showPage('kegiatan')">Lihat Semua →</span></div>${kegiatanTerdekat.map(k=>`<div class="widget-item"><div class="wi-title">${esc(k.judul)} <span class="badge b-purple">${esc(k.kategori||'')}</span></div><div class="wi-meta">📅 ${tglIndo(k.tgl)} · 🕐 ${esc(k.waktuMulai||'-')}${k.waktuSelesai?' - '+esc(k.waktuSelesai):''} · 📍 ${esc(k.lokasi||'-')}</div></div>`).join('')}</div>`;
  }
  
  const pengaduanAktif=(appData.lapor||[]).filter(l=>l.status!=='Selesai'&&l.status!=='Ditolak').slice(0,3);
  if(pengaduanAktif.length){
    html+=`<div class="card"><div class="card-header"><h3>⚠️ Pengaduan Aktif</h3><span class="link" onclick="showPage('pengaduan')">Lihat Semua →</span></div>${pengaduanAktif.map(l=>{const w=appData.warga.find(x=>x.id===l.wargaId);const bc=l.status==='Baru'?'b-yellow':'b-blue';return `<div class="widget-item"><div class="wi-title">${esc(l.judul)} <span class="badge ${bc}">${esc(l.status)}</span></div><div class="wi-meta">👤 ${esc(w?w.nama:'Warga')} · ${esc(l.kat)} · ${tglIndo(l.tgl)}</div></div>`;}).join('')}</div>`;
  }
  
  const pengumumanTerbaru=(appData.pengumuman||[]).slice(0,3);
  if(pengumumanTerbaru.length){
    html+=`<div class="card"><div class="card-header"><h3> Pengumuman Terbaru</h3><span class="link" onclick="showPage('pengumuman')">Lihat Semua →</span></div>${pengumumanTerbaru.map(p=>`<div class="widget-item"><div class="wi-title">${esc(p.judul)} ${p.pin?'📌':''} <span class="badge b-purple">${esc(p.kat||'')}</span></div><div class="wi-meta">📅 ${tglIndo(p.tgl)} · 👤 ${esc(p.oleh||'')}</div></div>`).join('')}</div>`;
  }
  
  const suratAktif=(appData.surat||[]).filter(s=>s.status!=='Selesai'&&s.status!=='Ditolak').slice(0,3);
  if(suratAktif.length){
    html+=`<div class="card"><div class="card-header"><h3>✉️ Surat Aktif</h3><span class="link" onclick="showPage('surat')">Lihat Semua →</span></div>${suratAktif.map(s=>{const w=appData.warga.find(x=>x.id===s.wargaId);const bc=s.status==='Diajukan'?'b-yellow':'b-blue';return `<div class="widget-item"><div class="wi-title">${esc(s.jenis)} <span class="badge ${bc}">${esc(s.status)}</span></div><div class="wi-meta"> ${esc(w?w.nama:'-')} · 🎯 ${esc(s.keperluan||'-')}</div></div>`;}).join('')}</div>`;

  }
  
  html+=`<div class="section-title">Menu Cepat</div><div class="menu-grid" id="homeMenu"></div>`;
  $('page-home').innerHTML=html;
  
  const cls={warga:'mi-1',iuran:'mi-2',keuangan:'mi-3',setoran:'mi-8',pengumuman:'mi-5',kegiatan:'mi-9',pengaduan:'mi-4',ronda:'mi-3',surat:'mi-7',tamu:'mi-6',voting:'mi-2'};

}

function renderWargaList(){
  const q=($('searchWarga')?$('searchWarga').value:'').toLowerCase();
  let l=(appData.warga||[]).slice();
  if(q)l=l.filter(w=>[w.nama,w.blok,w.gol,w.pekerjaan,w.hp].some(v=>String(v||'').toLowerCase().includes(q)));

  $('page-warga').innerHTML=`<div class="back-bar"><h2>👥 Data Warga</h2><button class="btn btn-back" onclick="showPage('home')">← Kembali</button></div><div class="card"><div class="card-header">${addBtn}</div><div class="search-box"><span class="si">🔍</span><input type="text" id="searchWarga" placeholder="Cari nama, blok, jabatan..." oninput="renderWargaList()"></div><div id="wargaList"></div></div>`;

function showWargaForm(w){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const e=!!w;openModal(`<div class="modal-header"><h3>${e?'✏️ Edit':'＋ Tambah'} Warga</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Nama *</label><input id="wNama" value="${e?esc(w.nama):''}"></div><div class="form-row"><div class="form-group"><label>Blok *</label><input id="wBlok" value="${e?esc(w.blok):''}"></div><div class="form-group"><label>HP</label><input id="wHp" value="${e?esc(w.hp||''):''}"></div></div><div class="form-row"><div class="form-group"><label>Jabatan</label><select id="wGol">${['Warga','Ketua RT','Sekretaris','Bendahara','Anggota Keamanan'].map(g=>`<option ${e&&w.gol===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="form-group"><label>Status</label><select id="wStatus">${['Tetap','Kontrak','Kost'].map(s=>`<option ${e&&w.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="form-group"><label>Pekerjaan</label><input id="wPekerjaan" value="${e?esc(w.pekerjaan||''):''}"></div><div class="form-group"><label> PIN (4 digit) *</label><input id="wPin" value="${e?(w.pin||'1234'):'1234'}" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div><button class="btn btn-primary btn-block" onclick="saveWarga('${e?w.id:''}')"> Simpan</button>`);}
async function saveWarga(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const nama=$('wNama').value.trim(),blok=$('wBlok').value.trim(),hp=$('wHp').value.trim(),gol=$('wGol').value,status=$('wStatus').value,pekerjaan=$('wPekerjaan').value.trim(),pin=$('wPin').value.trim();if(!nama||!blok)return showToast('Nama & Blok wajib','error');if(!/^\d{4}$/.test(pin))return showToast('PIN 4 digit','error');const l=appData.warga||[];if(id){const i=l.findIndex(x=>x.id===id);if(i>-1)l[i]={...l[i],nama,blok,hp,gol,status,pekerjaan,pin};}else l.push({id:uid('W'),nama,blok,hp,gol,status,pekerjaan,pin});appData.warga=l;await saveDataToFirebase();closeModal();showToast('Warga tersimpan di Firebase');populateLoginWarga();renderWargaList();}

function buildIuranBulan(){const s=new Set([bulanIni()]);(appData.iuran||[]).forEach(i=>s.add(i.bulan));$('iuranBulan').innerHTML=[...s].sort().reverse().map(b=>`<option value="${b}" ${b===bulanIni()?'selected':''}>${labelBulan(b)}</option>`).join('');}
function renderIuranList(){const b=$('iuranBulan').value||bulanIni();const nom=+appData.rt.iuranNominal||50000;const m={};(appData.iuran||[]).filter(i=>i.bulan===b).forEach(i=>m[i.wargaId]=i);const l=appData.warga||[];const ln=l.filter(w=>m[w.id]&&m[w.id].status==='Lunas').length;$('page-iuran').innerHTML=`<div class="back-bar"><h2>✓ Status Iuran</h2><button class="btn btn-back" onclick="showPage('home')">← Kembali</button></div><div class="card">${canEdit()?`<div class="card-header"><button class="btn btn-sm btn-secondary" onclick="ubahNominalIuran()">✏️ Ubah Nominal</button></div>`:''}<div class="info-box green"><div class="info-box-header"><h4>💡 Info</h4><button onclick="showPage('setoran')">Setor</button></div><p class="note">Nominal: <b>${rp(nom)}</b>/bulan</p></div><div class="filter-row"><select id="iuranBulan" onchange="renderIuranList()"></select></div><div id="iuranList"></div></div>`;$('iuranBulan').innerHTML=[...new Set([bulanIni(),...(appData.iuran||[]).map(i=>i.bulan)])].sort().reverse().map(b=>`<option value="${b}" ${b===bulanIni()?'selected':''}>${labelBulan(b)}</option>`).join('');$('iuranList').innerHTML=(l.length?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px 14px;background:var(--pt);border-radius:12px"><div style="font-size:13px;font-weight:700;color:var(--ink2)">${labelBulan(b)} · ${rp(nom)}/warga</div><span class="badge ${ln===l.length?'b-green':'b-yellow'}">${ln}/${l.length} lunas</span></div>`:'')+l.map(w=>{const r=m[w.id],ok=r&&r.status==='Lunas';return `<div class="data-item" style="${ok?'border-color:#BBF7D0;background:#F0FDF4':''}"><div class="data-avatar" style="${ok?'background:linear-gradient(135deg,#10B981,#059669)':''}">${ok?'✅':''}</div><div class="data-info"><div class="name">${esc(w.nama)} (Blok ${esc(w.blok)})</div><div class="detail">${ok?'Lunas '+tglPendek(r.tgl):'Belum membayar'}</div></div>${ok?`<span class="badge b-green">LUNAS</span>`:(canEdit()?`<button class="btn btn-sm btn-success" onclick="toggleIuran('${w.id}','${b}',${nom})">✔ Tandai Lunas</button>`:'')}</div>`;}).join('')||emptyState('✅','Belum ada warga');}
async function toggleIuran(wid,b,nom){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const l=appData.iuran||[];const i=l.findIndex(x=>x.wargaId===wid&&x.bulan===b);if(i>-1){if(l[i].status==='Lunas'){if(!confirm('Batalkan lunas?'))return;l[i]={...l[i],status:'Belum',tgl:null};}else l[i]={...l[i],status:'Lunas',tgl:today()};}else l.push({id:uid('I'),wargaId:wid,bulan:b,nominal:nom,status:'Lunas',tgl:today()});appData.iuran=l;await saveDataToFirebase();showToast('Status iuran diperbarui');renderIuranList();}

function buildKasBulan(){const s=new Set([bulanIni()]);(appData.kas||[]).forEach(k=>{if(k.tgl)s.add(k.tgl.slice(0,7));});$('filterBulan').innerHTML=[...s].sort().reverse().map(b=>`<option value="${b}" ${b===bulanIni()?'selected':''}>${labelBulan(b)}</option>`).join('');}
function applyFilter(){const b=$('filterBulan').value,p=$('filterPeriode').value;const f=(appData.kas||[]).filter(k=>k.tgl&&(p==='semua'||k.tgl.startsWith(b))).sort((a,c)=>(c.tgl||'').localeCompare(a.tgl||''));const sal=f.reduce((s,k)=>s+(k.tipe==='Masuk'?k.nominal:-k.nominal),0);$('kSaldo').textContent=rp(sal);$('kMasuk').textContent=rp(f.filter(k=>k.tipe==='Masuk').reduce((s,k)=>s+ +k.nominal,0));$('kKeluar').textContent=rp(f.filter(k=>k.tipe==='Keluar').reduce((s,k)=>s+ +k.nominal,0));$('mutasiList').innerHTML=f.length?`<table class="data-table"><thead><tr><th>Tanggal</th><th>Uraian</th><th>Kategori</th><th class="text-right">Jumlah</th>${canEdit()?'<th class="text-center">Aksi</th>':''}</tr></thead><tbody>${f.map(k=>`<tr><td>${tglPendek(k.tgl)}</td><td><strong>${esc(k.urai)}</strong><br><span class="badge ${k.tipe==='Masuk'?'b-green':'b-red'}">${k.tipe}</span></td><td>${esc(k.kat)}</td><td class="text-right"><span class="${k.tipe==='Masuk'?'amt-in':'amt-out'}" style="font-weight:700;color:${k.tipe==='Masuk'?'var(--green)':'var(--red)'}">${k.tipe==='Masuk'?'+':'-'}${rp(k.nominal)}</span></td>${canEdit()?`<td class="text-center"><button class="btn-edit" style="padding:5px 9px;border:none;border-radius:8px" onclick="showTambahTransaksi(appData.kas.find(x=>x.id==='${k.id}'))">✏️</button> <button class="btn-del" style="padding:5px 9px;border:none;border-radius:8px" onclick="deleteTransaksi('${k.id}')">🗑️</button></td>`:''}</tr>`).join('')}</tbody></table>`:emptyState('','Tidak ada transaksi');}
function resetFilter(){$('filterBulan').value=bulanIni();$('filterPeriode').value='bulan';applyFilter();}
function showTambahTransaksi(e){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');e=e||null;openModal(`<div class="modal-header"><h3>${e?'✏️ Edit':'＋ Tambah'} Transaksi</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-row"><div class="form-group"><label>Tipe</label><select id="tTipe"><option value="Masuk" ${e&&e.tipe==='Masuk'?'selected':''}>Pemasukan</option><option value="Keluar" ${e&&e.tipe==='Keluar'?'selected':''}>Pengeluaran</option></select></div><div class="form-group"><label>Kategori</label><select id="tKat">${['Iuran Warga','Donasi','Kebersihan','Keamanan','Kegiatan','Administrasi','Lainnya'].map(k=>`<option ${e&&e.kat===k?'selected':''}>${k}</option>`).join('')}</select></div></div><div class="form-group"><label>Uraian *</label><input id="tUrai" value="${e?esc(e.urai):''}"></div><div class="form-row"><div class="form-group"><label>Nominal *</label><input type="number" id="tNominal" value="${e?e.nominal:''}"></div><div class="form-group"><label>Tanggal</label><input type="date" id="tTgl" value="${e?e.tgl:today()}"></div></div><button class="btn btn-primary btn-block" onclick="saveTransaksi('${e?e.id:''}')">💾 Simpan</button>`);}
async function saveTransaksi(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const tipe=$('tTipe').value,kat=$('tKat').value,urai=$('tUrai').value.trim(),nominal=parseInt($('tNominal').value),tgl=$('tTgl').value;if(!urai||!nominal||!tgl)return showToast('Lengkapi field','error');const l=appData.kas||[];if(id){const i=l.findIndex(x=>x.id===id);if(i>-1)l[i]={...l[i],tipe,kat,urai,nominal,tgl};}else l.unshift({id:uid('K'),tgl,tipe,kat,urai,nominal});appData.kas=l;await saveDataToFirebase();closeModal();showToast('Transaksi tersimpan');buildKasBulan();applyFilter();}

function renderLPJ(){if(!isStaff())return;const kas=appData.kas||[];const sal=kas.reduce((s,k)=>s+(k.tipe==='Masuk'?k.nominal:-k.nominal),0);const mk=kas.filter(k=>k.tipe==='Masuk').reduce((s,k)=>s+ +k.nominal,0);const kl=kas.filter(k=>k.tipe==='Keluar').reduce((s,k)=>s+ +k.nominal,0);const b=bulanIni();const f=kas.filter(k=>k.tgl&&k.tgl.startsWith(b)).sort((a,c)=>(c.tgl||'').localeCompare(a.tgl||''));const lpjSection=`<div class="card" style="margin-top:20px"><div class="card-header"><h3>📋 LPJ - ${labelBulan(b)}</h3><div style="display:flex;gap:8px"><button class="btn btn-sm ${appData.rt.lpjPublished?'btn-secondary':'btn-success'}" onclick="togglePublishLPJ()">${appData.rt.lpjPublished?'🔒 Unpublish':'📢 Publish ke Warga'}</button><button class="btn btn-sm btn-warning" onclick="window.print()">🖨️ Cetak</button></div></div><div class="info-box ${appData.rt.lpjPublished?'green':''}"><div class="info-box-header"><h4>Status: <span class="badge ${appData.rt.lpjPublished?'b-green':'b-yellow'}">${appData.rt.lpjPublished?'Dipublish ke Warga':'Belum Dipublish'}</span></h4></div><p class="note">${appData.rt.lpjPublished?'✅ Warga dapat melihat laporan keuangan ini di dashboard mereka.':'⚠️ Laporan belum terlihat oleh warga. Klik "Publish" untuk menampilkan.'}</p></div><div class="finance-grid" style="margin-bottom:20px"><div class="finance-item green"><div class="label">Saldo Akhir</div><div class="value">${rp(sal)}</div></div><div class="finance-item blue"><div class="label">Total Pemasukan</div><div class="value">${rp(mk)}</div></div><div class="finance-item orange"><div class="label">Total Pengeluaran</div><div class="value">${rp(kl)}</div></div></div><h4 style="font-size:14px;font-weight:700;margin-bottom:10px">📊 Detail Transaksi</h4><table class="data-table"><thead><tr><th>No</th><th>Tanggal</th><th>Uraian</th><th>Kategori</th><th class="text-right">Jumlah</th></tr></thead><tbody>${f.map((k,i)=>`<tr><td>${i+1}</td><td>${tglPendek(k.tgl)}</td><td><strong>${esc(k.urai)}</strong><br><span class="badge ${k.tipe==='Masuk'?'b-green':'b-red'}">${k.tipe}</span></td><td>${esc(k.kat)}</td><td class="text-right"><span style="font-weight:700;color:${k.tipe==='Masuk'?'var(--green)':'var(--red)'}">${k.tipe==='Masuk'?'+':'-'}${rp(k.nominal)}</span></td></tr>`).join('')}</tbody><tfoot><tr style="background:var(--pt);font-weight:700"><td colspan="4" class="text-right">SALDO AKHIR:</td><td class="text-right" style="color:var(--pdd);font-size:16px">${rp(sal)}</td></tr></tfoot></table></div>`;$('page-keuangan').innerHTML+=lpjSection;}
async function togglePublishLPJ(){if(!isStaff())return showToast('Hanya Ketua RT & Bendahara','error');appData.rt.lpjPublished=!appData.rt.lpjPublished;await saveDataToFirebase();showToast(appData.rt.lpjPublished?'LPJ dipublish ke warga':'LPJ di-unpublish');applyFilter();renderLPJ();}

function buildSetorBulan(){const s=new Set([bulanIni()]);const d=new Date();for(let i=-2;i<6;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1);s.add(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));}(appData.setoran||[]).forEach(x=>s.add(x.bulan));$('setorBulan').innerHTML=[...s].sort().reverse().map(b=>`<option value="${b}" ${b===bulanIni()?'selected':''}>${labelBulan(b)}</option>`).join('');$('setorNominal').value=appData.rt.iuranNominal||50000;}
async function submitSetoran(){const bulan=$('setorBulan').value,nominal=parseInt($('setorNominal').value),metode=$('setorMetode').value,ref=$('setorRef').value.trim(),catatan=$('setorCatatan').value.trim();if(!nominal||nominal<1000)return showToast('Nominal min 1000','error');const l=appData.setoran||[];l.unshift({id:uid('S'),wargaId:currentUser.id,namaWarga:currentUser.nama,blok:currentUser.blok,bulan,nominal,metode,ref,catatan,bukti:[],status:'Pending',tglSetor:today(),tglKonfirmasi:null,dikonfirmasiOleh:null,alasan:''});appData.setoran=l;await saveDataToFirebase();showToast('Setoran terkirim ke Firebase');$('setorRef').value='';$('setorCatatan').value='';renderSetoran();}
function renderSetoran(){const cc=$('konfirmasiCard');if(isStaff()){cc.style.display='block';const pd=(appData.setoran||[]).filter(s=>s.status==='Pending');$('pendingCount').textContent=pd.length;$('konfirmasiList').innerHTML=pd.length?pd.map(s=>setoranRow(true,s)).join(''):emptyState('','Tidak ada setoran menunggu');}else cc.style.display='none';const mine=(appData.setoran||[]).filter(s=>s.wargaId===(currentUser?currentUser.id:'-'));$('rsLunas').textContent=mine.filter(s=>s.status==='Dikonfirmasi').length;$('rsPending').textContent=mine.filter(s=>s.status==='Pending').length;$('rsDitolak').textContent=mine.filter(s=>s.status==='Ditolak').length;$('riwayatList').innerHTML=mine.length?mine.map(s=>setoranRow(false,s)).join(''):emptyState('','Belum pernah setor');}
function setoranRow(konf,s){const w=appData.warga.find(x=>x.id===s.wargaId);const bc=s.status==='Pending'?'b-yellow':s.status==='Dikonfirmasi'?'b-green':'b-red';const bi=s.status==='Pending'?'':s.status==='Dikonfirmasi'?'✅':'❌';let act='';if(konf&&s.status==='Pending')act=`<div class="data-actions"><button class="btn-edit" style="background:#D1FAE5;color:#065F46" onclick="konfirmasiSetoran('${s.id}',1)">✅ Terima</button><button class="btn-del" onclick="konfirmasiSetoran('${s.id}',0)">❌ Tolak</button></div>`;return `<div class="data-item"><div class="data-avatar" style="background:linear-gradient(135deg,#8B5CF6,#6D28D9)">📤</div><div class="data-info"><div class="name">${konf?esc(w?w.nama:s.namaWarga)+' · ':''}${labelBulan(s.bulan)} <span class="badge ${bc}">${bi} ${s.status}</span></div><div class="detail"> <b>${rp(s.nominal)}</b> · ${esc(s.metode)}${s.ref?' · '+esc(s.ref):''}</div><div class="detail">📅 ${tglPendek(s.tglSetor)}${s.tglKonfirmasi?' · '+tglPendek(s.tglKonfirmasi)+(s.dikonfirmasiOleh?' oleh '+esc(s.dikonfirmasiOleh):''):''}</div>${s.alasan?`<div class="detail" style="color:#DC2626">️ ${esc(s.alasan)}</div>`:''}${s.catatan?`<div class="detail" style="color:var(--muted)">💬 ${esc(s.catatan)}</div>`:''}</div>${act}</div>`;}
async function konfirmasiSetoran(id,ok){const s=(appData.setoran||[]).find(x=>x.id===id);if(!s)return;if(ok){if(!confirm('Terima setoran '+rp(s.nominal)+' dari '+s.namaWarga+'?'))return;s.status='Dikonfirmasi';s.tglKonfirmasi=today();s.dikonfirmasiOleh=currentUser.nama;appData.kas.unshift({id:uid('K'),tgl:today(),tipe:'Masuk',kat:'Iuran Warga',urai:'Setoran '+labelBulan(s.bulan)+' - '+s.namaWarga,nominal:s.nominal});const ii=appData.iuran.findIndex(x=>x.wargaId===s.wargaId&&x.bulan===s.bulan);if(ii>-1)appData.iuran[ii]={...appData.iuran[ii],status:'Lunas',tgl:today()};else appData.iuran.push({id:uid('I'),wargaId:s.wargaId,bulan:s.bulan,nominal:s.nominal,status:'Lunas',tgl:today()});await saveDataToFirebase();showToast('Setoran diterima');}else{const al=prompt('Alasan penolakan:');if(!al)return showToast('Alasan wajib','error');s.status='Ditolak';s.tglKonfirmasi=today();s.dikonfirmasiOleh=currentUser.nama;s.alasan=al;await saveDataToFirebase();showToast('Setoran ditolak');}renderSetoran();}

async function saveKegiatan(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const judul=$('kJudul').value.trim(),kategori=$('kKategori').value,status=$('kStatus').value,tgl=$('kTgl').value,waktuMulai=$('kMulai').value.trim(),waktuSelesai=$('kSelesai').value.trim(),lokasi=$('kLokasi').value.trim(),penanggungJawab=$('kPJ').value,deskripsi=$('kDesk').value.trim();if(!judul||!tgl)return showToast('Judul & Tanggal wajib','error');const l=appData.kegiatan||[];if(id){const i=l.findIndex(x=>x.id===id);if(i>-1)l[i]={...l[i],judul,kategori,status,tgl,waktuMulai,waktuSelesai,lokasi,penanggungJawab,deskripsi};}else{l.unshift({id:uid('KEG'),judul,kategori,status,tgl,waktuMulai,waktuSelesai,lokasi,penanggungJawab,deskripsi,dokumentasi:[],createdBy:currentUser.id,createdAt:today()});}appData.kegiatan=l;await saveDataToFirebase();closeModal();showToast('Kegiatan tersimpan');renderKegiatanList();}

async function saveSurat(id){const wargaId=$('sWarga').value,jenis=$('sJenis').value,keperluan=$('sKeperluan').value.trim(),status=$('sStatus').value,noSurat=$('sNo').value.trim();if(!keperluan)return showToast('Keperluan wajib','error');const l=appData.surat||[];if(id){if(!canEdit()&&appData.surat.find(x=>x.id===id).wargaId!==currentUser.id)return showToast('Tidak bisa edit surat orang lain','error');const i=l.findIndex(x=>x.id===id);if(i>-1)l[i]={...l[i],wargaId,jenis,keperluan,status,noSurat};}else l.unshift({id:uid('S'),wargaId,jenis,keperluan,status,noSurat,tgl:today()});appData.surat=l;await saveDataToFirebase();closeModal();showToast('Surat tersimpan');renderSurat();}
async function deleteSurat(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');if(!confirm('Hapus?'))return;appData.surat=appData.surat.filter(x=>x.id!==id);await saveDataToFirebase();showToast('Dihapus');renderSurat();}

function renderTamu(){const l=(appData.tamu||[]).slice().sort((a,b)=>(b.tglMasuk||'').localeCompare(a.tglMasuk||''));const addBtn=canEdit()?`<button class="btn btn-sm btn-primary" onclick="showTamuForm()">＋ Tambah</button>`:'';$('page-tamu').innerHTML=`<div class="back-bar"><h2>👤 Buku Tamu</h2><button class="btn btn-back" onclick="showPage('home')">← Kembali</button></div><div class="card"><div class="card-header">${addBtn}</div><div id="tamuList"></div></div>`;$('tamuList').innerHTML=l.length?l.map(t=>{const bc=t.status==='Menginap'?'b-yellow':'b-green';return `<div class="data-item"><div class="data-avatar" style="background:linear-gradient(135deg,#FBCFE8,#F9A8D4)">👤</div><div class="data-info"><div class="name">${esc(t.nama)} <span class="badge ${bc}">${esc(t.status)}</span></div><div class="detail"> Dari <b>${esc(t.asal)}</b>${t.alamat?' · '+esc(t.alamat):''}</div><div class="detail">🎯 ${esc(t.keperluan||'-')} · Penjamin: ${esc(t.penjamin||'-')}</div><div class="detail">📅 ${tglPendek(t.tglMasuk)}${t.tglKeluar?' → '+tglPendek(t.tglKeluar):''}</div></div>${canEdit()?`<div class="data-actions"><button class="btn-edit" onclick="showTamuForm(appData.tamu.find(x=>x.id==='${t.id}'))">✏️</button><button class="btn-del" onclick="deleteTamu('${t.id}')">🗑️</button></div>`:''}</div>`;}).join(''):emptyState('👤','Belum ada tamu');}
function showTamuForm(t){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const e=!!t;openModal(`<div class="modal-header"><h3>${e?'✏️ Edit':'＋ Catat'} Tamu</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-row"><div class="form-group"><label>Nama *</label><input id="tNama" value="${e?esc(t.nama):''}"></div><div class="form-group"><label>Asal *</label><input id="tAsal" value="${e?esc(t.asal):''}"></div></div><div class="form-group"><label>Alamat</label><input id="tAlamat" value="${e?esc(t.alamat||''):''}"></div><div class="form-row"><div class="form-group"><label>Keperluan</label><select id="tKeperluan">${['Menginap','Kunjungan','Kost','Bekerja','Lainnya'].map(k=>`<option ${e&&t.keperluan===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="form-group"><label>Penjamin</label><select id="tPenjamin">${(appData.warga||[]).map(w=>`<option ${e&&t.penjamin===w.nama?'selected':''}>${esc(w.nama)}</option>`).join('')}</select></div></div><div class="form-row"><div class="form-group"><label>Tgl Masuk *</label><input type="date" id="tMasuk" value="${e?t.tglMasuk:today()}"></div><div class="form-group"><label>Tgl Keluar</label><input type="date" id="tKeluar" value="${e?(t.tglKeluar||''):''}"></div></div><div class="form-group"><label>Status</label><select id="tStatus"><option value="Menginap" ${e&&t.status==='Menginap'?'selected':''}>Menginap</option><option value="Selesai" ${e&&t.status==='Selesai'?'selected':''}>Selesai</option></select></div><button class="btn btn-primary btn-block" onclick="saveTamu('${e?t.id:''}')">💾 Simpan</button>`);}
async function saveTamu(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const nama=$('tNama').value.trim(),asal=$('tAsal').value.trim(),alamat=$('tAlamat').value.trim(),keperluan=$('tKeperluan').value,penjamin=$('tPenjamin').value,tglMasuk=$('tMasuk').value,tglKeluar=$('tKeluar').value,status=$('tStatus').value;if(!nama||!asal||!tglMasuk)return showToast('Lengkapi field wajib','error');const l=appData.tamu||[];if(id){const i=l.findIndex(x=>x.id===id);if(i>-1)l[i]={...l[i],nama,asal,alamat,keperluan,penjamin,tglMasuk,tglKeluar,status};}else l.unshift({id:uid('T'),nama,asal,alamat,keperluan,penjamin,tglMasuk,tglKeluar,status});appData.tamu=l;await saveDataToFirebase();closeModal();showToast('Tamu tersimpan');renderTamu();}
async function deleteTamu(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');if(!confirm('Hapus?'))return;appData.tamu=appData.tamu.filter(x=>x.id!==id);await saveDataToFirebase();showToast('Dihapus');renderTamu();}

function renderVoting(){const l=(appData.voting||[]).slice().sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));const addBtn=canEdit()?`<button class="btn btn-sm btn-primary" onclick="showVotingForm()">＋ Buat</button>`:'';$('page-voting').innerHTML=`<div class="back-bar"><h2>️ Jajak Pendapat</h2><button class="btn btn-back" onclick="showPage('home')">← Kembali</button></div><div class="card"><div class="card-header">${addBtn}</div><div id="votingList"></div></div>`;$('votingList').innerHTML=l.length?l.map(v=>{const tot=v.pilihan.reduce((s,p)=>s+(p.votes||0),0);return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px"><h4 style="font-size:15px;font-weight:800;flex:1">${esc(v.pertanyaan)}</h4><span class="badge ${v.status==='Aktif'?'b-green':'b-gray'}">${esc(v.status)}</span></div><div style="font-size:12px;color:var(--muted2);margin-bottom:12px">📅 ${tglIndo(v.tgl)} · 👥 ${tot} suara</div>${v.pilihan.map((p,i)=>{const pc=tot?Math.round((p.votes||0)/tot*100):0;return `<div class="voting-option" onclick="voteVoting('${v.id}',${i})"><span style="font-weight:600">${i+1}. ${esc(p.text)}</span><span style="font-size:12px;color:var(--muted);font-weight:700">${p.votes||0} (${pc}%)</span></div><div class="vbar"><div style="width:${pc}%"></div></div>`;}).join('')}${canEdit()?`<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-sm btn-warning" onclick="showVotingForm(appData.voting.find(x=>x.id==='${v.id}'))">✏️ Edit</button><button class="btn btn-sm btn-danger" onclick="deleteVoting('${v.id}')">🗑️ Hapus</button></div>`:''}</div>`;}).join(''):emptyState('️','Belum ada voting');}
function showVotingForm(v){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const e=!!v;openModal(`<div class="modal-header"><h3>${e?'✏️ Edit':'＋ Buat'} Voting</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Pertanyaan *</label><input id="vQ" value="${e?esc(v.pertanyaan):''}"></div><div class="form-group"><label>Pilihan 1 *</label><input id="vP1" value="${e?esc((v.pilihan[0]||{}).text||''):''}"></div><div class="form-group"><label>Pilihan 2 *</label><input id="vP2" value="${e?esc((v.pilihan[1]||{}).text||''):''}"></div><div class="form-row"><div class="form-group"><label>Pilihan 3</label><input id="vP3" value="${e?esc((v.pilihan[2]||{}).text||''):''}"></div><div class="form-group"><label>Pilihan 4</label><input id="vP4" value="${e?esc((v.pilihan[3]||{}).text||''):''}"></div></div><div class="form-group"><label>Status</label><select id="vStatus"><option value="Aktif" ${e&&v.status==='Aktif'?'selected':''}>Aktif</option><option value="Selesai" ${e&&v.status==='Selesai'?'selected':''}>Selesai</option></select></div><button class="btn btn-primary btn-block" onclick="saveVoting('${e?v.id:''}')">💾 Simpan</button>`);}
async function saveVoting(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');const q=$('vQ').value.trim(),p1=$('vP1').value.trim(),p2=$('vP2').value.trim(),p3=$('vP3').value.trim(),p4=$('vP4').value.trim(),st=$('vStatus').value;if(!q||!p1||!p2)return showToast('Min 2 pilihan','error');const pil=[{text:p1,votes:0},{text:p2,votes:0}];if(p3)pil.push({text:p3,votes:0});if(p4)pil.push({text:p4,votes:0});const l=appData.voting||[];if(id){const i=l.findIndex(x=>x.id===id);if(i>-1){pil.forEach((p,j)=>{if(l[i].pilihan[j])p.votes=l[i].pilihan[j].votes||0;});l[i]={...l[i],pertanyaan:q,pilihan:pil,status:st};}}else l.unshift({id:uid('V'),pertanyaan:q,pilihan:pil,status:st,tgl:today(),createdBy:currentUser.id});appData.voting=l;await saveDataToFirebase();closeModal();showToast('Voting tersimpan');renderVoting();}
async function deleteVoting(id){if(!canEdit())return showToast('Hanya Ketua RT & Bendahara','error');if(!confirm('Hapus?'))return;appData.voting=appData.voting.filter(x=>x.id!==id);await saveDataToFirebase();showToast('Dihapus');renderVoting();}
async function voteVoting(vid,i){const v=(appData.voting||[]).find(x=>x.id===vid);if(!v)return;if(v.status!=='Aktif')return showToast('Voting ditutup','error');v.pilihan[i].votes=(v.pilihan[i].votes||0)+1;await saveDataToFirebase();showToast('Suara tercatat!');renderVoting();}

function renderAkun(){if(!currentUser)return;const w=currentUser;$('page-akun').innerHTML=`<div class="back-bar"><h2>⚙️ Akun Saya</h2><button class="btn btn-back" onclick="showPage('home')">← Kembali</button></div><div class="card"><div class="card-header"><button class="btn btn-sm btn-secondary" onclick="editProfil()">✏️ Edit Profil</button></div><div id="akunInfo"></div><button class="btn btn-danger btn-block" style="margin-top:16px" onclick="doLogout()">Keluar dari Portal</button></div>${isBendahara()?`<div class="card" id="backupCard"><div class="card-header"><h3>💾 Backup & Restore</h3></div><p style="font-size:13px;color:var(--muted);margin-bottom:14px">Data otomatis tersimpan di Firebase Cloud. Download backup JSON untuk cadangan lokal.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="downloadBackup()">📥 Download Backup</button><button class="btn btn-secondary" onclick="document.getElementById('restoreFile').click()">📤 Restore Backup</button><input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup(event)"></div></div>`:''}`;$('akunInfo').innerHTML=`<div style="text-align:center;padding:20px 0"><div style="width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;margin:0 auto 14px">${initials(w.nama)}</div><h3 style="font-size:21px;font-weight:800">${esc(w.nama)}</h3><p style="color:var(--muted);margin-top:4px"><span class="badge b-purple">${esc(w.gol)}</span></p></div><div class="row-item" style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)"><div><div style="font-size:12px;color:var(--muted2)">Blok</div><div style="font-size:14px;font-weight:600">${esc(w.blok)}</div></div></div><div class="row-item" style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)"><div><div style="font-size:12px;color:var(--muted2)">HP</div><div style="font-size:14px;font-weight:600">${esc(w.hp||'-')}</div></div></div><div class="row-item" style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)"><div><div style="font-size:12px;color:var(--muted2)">Pekerjaan</div><div style="font-size:14px;font-weight:600">${esc(w.pekerjaan||'-')}</div></div></div><div class="row-item" style="display:flex;justify-content:space-between;align-items:center;padding:13px 0"><div><div style="font-size:12px;color:var(--muted2)">PIN</div><div style="font-size:14px;font-weight:600">•••• <span class="badge b-gray">tersembunyi</span></div></div></div>`;}
function editProfil(){const w=currentUser;openModal(`<div class="modal-header"><h3>✏️ Edit Profil</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Nama</label><input id="pfNama" value="${esc(w.nama)}"></div><div class="form-row"><div class="form-group"><label>Blok</label><input id="pfBlok" value="${esc(w.blok)}"></div><div class="form-group"><label>HP</label><input id="pfHp" value="${esc(w.hp||'')}"></div></div><div class="form-group"><label>Pekerjaan</label><input id="pfPekerjaan" value="${esc(w.pekerjaan||'')}"></div><div class="form-group"><label>Ganti PIN (kosongkan jika tidak)</label><input id="pfPin" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div><button class="btn btn-primary btn-block" onclick="saveProfil()">💾 Simpan</button>`);}
async function saveProfil(){const nama=$('pfNama').value.trim(),blok=$('pfBlok').value.trim(),hp=$('pfHp').value.trim(),pek=$('pfPekerjaan').value.trim(),pin=$('pfPin').value.trim();if(!nama||!blok)return showToast('Nama & Blok wajib','error');if(pin&&!/^\d{4}$/.test(pin))return showToast('PIN 4 digit','error');const i=appData.warga.findIndex(x=>x.id===currentUser.id);if(i>-1){appData.warga[i]={...appData.warga[i],nama,blok,hp,pekerjaan:pek,...(pin?{pin}:{})};currentUser=appData.warga[i];}await saveDataToFirebase();$('hName').textContent=currentUser.nama;closeModal();showToast('Profil tersimpan');renderAkun();populateLoginWarga();}
function downloadBackup(){const data={version:'2.0',exportDate:new Date().toISOString(),firebase:true,data:appData};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='backup-saung-kebon-firebase-'+today()+'.json';a.click();URL.revokeObjectURL(url);showToast('Backup JSON didownload!');}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!data.data)throw new Error('Format salah');if(!confirm('⚠️ Restore akan MENGGANTI semua data di Firebase.\n\nLanjutkan?'))return;appData=data.data;normalize();db.ref('/').set(appData).then(()=>{showToast('Backup di-restore ke Firebase!');populateLoginWarga();updateDashboard();refreshPage();}).catch(err=>showToast('Gagal restore: '+err.message,'error'));}catch(err){showToast('File backup tidak valid','error');}};reader.readAsText(file);e.target.value='';}

function showNotif(){const pd=(appData.setoran||[]).filter(s=>s.status==='Pending').length;const br=(appData.lapor||[]).filter(s=>s.status==='Baru').length;const kg=(appData.kegiatan||[]).filter(k=>k.status==='Akan Datang').length;openModal(`<div class="modal-header"><h3>🔔 Notifikasi</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div style="display:flex;flex-direction:column;gap:10px">${pd&&isStaff()?`<div style="padding:12px;background:var(--pt);border-radius:12px;border-left:4px solid var(--p);cursor:pointer" onclick="closeModal();showPage('setoran')"><b>📤 ${pd} setoran menunggu</b></div>`:''}${br?`<div style="padding:12px;background:#FEF2F2;border-radius:12px;border-left:4px solid var(--red);cursor:pointer" onclick="closeModal();showPage('pengaduan')"><b>🚨 ${br} pengaduan baru</b></div>`:''}${kg?`<div style="padding:12px;background:#FEF3C7;border-radius:12px;border-left:4px solid #F59E0B;cursor:pointer" onclick="closeModal();showPage('kegiatan')"><b>📅 ${kg} kegiatan akan datang</b></div>`:''}<div style="padding:12px;background:#EFF6FF;border-radius:12px;border-left:4px solid var(--blue)"><b> Pengumuman terbaru</b><div style="font-size:12px;color:var(--muted)">${esc(((appData.pengumuman||[]).find(p=>p.pin)||(appData.pengumuman||[])[0]||{}).judul||'-')}</div></div>${!pd&&!br&&!kg?'<div class="empty" style="padding:20px"><div class="empty-icon">🎉</div><p>Tidak ada notifikasi</p></div>':''}</div>`);}
function showAnnouncementDetail(){const p=(appData.pengumuman||[]).find(x=>x.pin)||(appData.pengumuman||[])[0];if(!p)return;openModal(`<div class="modal-header"><h3> ${esc(p.judul)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div><span class="badge b-purple">${esc(p.kat||'')}</span><p style="margin:12px 0;line-height:1.7;color:#4B5563">${esc(p.isi)}</p><div style="font-size:12px;color:#9CA3AF">📅 ${tglIndo(p.tgl)} · 👤 ${esc(p.oleh||'')}</div>`);}

(async function init(){await loadDataFromFirebase();normalize();populateLoginWarga();$('loading').style.display='none';const s=localStorage.getItem('rtku_sess');if(s){try{const d=JSON.parse(s);const w=(appData.warga||[]).find(x=>x.id===d.id);if(w&&Date.now()-d.t<7*864e5){currentUser=w;currentPage=d.p||'home';enterApp();showToast('Selamat datang kembali!','info');return;}}catch(e){}}$('loginPage').style.display='flex';})();
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('online',()=>updateSyncStatus(true));
window.addEventListener('offline',()=>updateSyncStatus(false));
</script>
</body>
</html>
