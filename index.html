<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Saung Kebun RT 11 RW 44</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#7C3AED;--pd:#6D28D9;--pdd:#5B21B6;--pt:#EDE9FE;--pt2:#F5F3FF;--ink:#1F2937;--ink2:#374151;--muted:#6B7280;--muted2:#9CA3AF;--line:#E5E7EB;--line2:#F3F4F6;--bg:#F4F4F8;--card:#fff;--green:#10B981;--red:#EF4444;--blue:#3B82F6;--orange:#F97316;--sbw:260px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#C4B5FD;border-radius:8px}

/* DESKTOP LAYOUT */
.desktop-layout{display:grid;grid-template-columns:var(--sbw) 1fr;min-height:100vh}

/* SIDEBAR DESKTOP */
.sidebar-desktop{background:#fff;border-right:1px solid var(--line);padding:20px 0;position:fixed;left:0;top:0;bottom:0;width:var(--sbw);overflow-y:auto;z-index:50}
.sidebar-header{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sidebar-header h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sidebar-header h2 .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-header h2 .logo-icon svg{width:20px;height:20px;color:#fff}
.sidebar-header p{font-size:12px;color:var(--muted);margin-top:2px}
.sidebar-menu{display:flex;flex-direction:column;gap:2px;padding:0 10px 20px}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:all .15s;border-radius:10px;min-height:44px}
.menu-item:hover{background:var(--pt2);color:var(--ink)}
.menu-item.active{background:var(--pt);color:var(--pdd);border-right:3px solid var(--p)}
.menu-item .icon-wrap{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-item .icon-wrap .svg-icon{width:22px;height:22px}
.menu-item.logout-item{color:var(--red);margin-top:12px;border-top:1px solid var(--line);padding-top:16px}
.menu-item.logout-item:hover{background:#FEF2F2}

/* MAIN CONTENT DESKTOP */
.main-desktop{margin-left:var(--sbw);min-height:100vh}

/* HEADER DESKTOP */
.header-desktop{background:linear-gradient(135deg,var(--p),var(--pd),var(--pdd));color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(109,40,217,.2);position:relative;overflow:hidden}
.header-desktop::before{content:"";position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.header-left{display:flex;align-items:center;gap:16px;position:relative}
.user-avatar-desktop{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.user-info-desktop h2{font-size:18px;font-weight:700;margin-bottom:4px}
.user-info-desktop p{font-size:13px;opacity:.95;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px;position:relative}
.notif-btn-desktop{width:44px;height:44px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border:none;border-radius:12px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;color:#fff}
.notif-btn-desktop .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid var(--pd)}
.notif-btn-desktop .badge.show{display:flex}

/* CONTENT AREA */
.content-area{padding:24px 28px;max-width:1400px;margin:0 auto}

/* MOBILE APP CONTAINER */
.mobile-app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.1)}

/* HEADER MOBILE */
.app-header{position:relative;height:180px;background:linear-gradient(135deg,rgba(124,58,237,.85),rgba(109,40,217,.9)),url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%237C3AED" width="1200" height="600"/><path fill="%236D28D9" d="M0 300L50 283.3C100 266.7 200 233.3 300 216.7C400 200 500 200 600 216.7C700 233.3 800 266.7 900 283.3C1000 300 1100 300 1150 300L1200 300L1200 600L1150 600C1100 600 1000 600 900 600C800 600 700 600 600 600C500 600 400 600 300 600C200 600 100 600 50 600L0 600Z"/></svg>') center/cover;overflow:hidden}
.app-header::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.3))}
.header-top{position:relative;z-index:2;padding:16px;display:flex;justify-content:space-between;align-items:center}
.user-info{display:flex;align-items:center;gap:12px}
.user-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.user-greeting h2{color:#fff;font-size:16px;font-weight:700}
.user-greeting p{color:rgba(255,255,255,.9);font-size:12px;margin-top:2px}
.header-actions{display:flex;gap:8px}
.header-btn{width:40px;height:40px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;cursor:pointer}
.header-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.header-location{position:absolute;bottom:16px;left:16px;right:16px;z-index:2;color:#fff}
.header-location h1{font-size:22px;font-weight:800}
.header-location p{font-size:12px;opacity:.9;margin-top:4px}

/* MAIN CONTENT MOBILE */
.main-content{padding:16px;padding-bottom:100px}

/* STATS CARDS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-40px;position:relative;z-index:3}
.stat-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid var(--line)}
.stat-card .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:18px}
.stat-card .stat-icon.blue{background:#DBEAFE;color:var(--blue)}
.stat-card .stat-icon.green{background:#D1FAE5;color:var(--green)}
.stat-card .stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-card .stat-value{font-size:20px;font-weight:800;color:var(--ink);margin-top:4px}

/* CHART CARD */
.chart-card{background:#fff;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid var(--line)}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.chart-header h3{font-size:16px;font-weight:700}
.chart-nav{display:flex;align-items:center;gap:12px}
.chart-nav button{width:32px;height:32px;border-radius:10px;background:var(--pt);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer}
.chart-nav button:active{transform:scale(.95)}
.chart-nav span{font-size:14px;font-weight:700;min-width:120px;text-align:center}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;justify-content:space-between;height:160px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.bar-pair{display:flex;gap:4px;align-items:flex-end;height:140px}
.bar{width:14px;border-radius:6px 6px 0 0;transition:all .3s;position:relative}
.bar.income{background:var(--blue)}
.bar.expense{background:var(--ink)}
.bar-label{font-size:9px;color:var(--muted);font-weight:600;text-align:center}

.chart-legend{display:flex;justify-content:center;gap:20px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-dot.income{background:var(--blue)}
.legend-dot.expense{background:var(--ink)}

/* IURAN BANNER */
.iuran-banner{background:linear-gradient(135deg,#F97316,#EA580C);border-radius:16px;padding:16px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(249,115,22,.3);cursor:pointer}
.iuran-banner::before{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%}
.iuran-banner::after{content:"";position:absolute;right:20px;bottom:-30px;width:80px;height:80px;background:rgba(255,255,255,.08);border-radius:50%}
.iuran-info{position:relative;z-index:1}
.iuran-info .label{font-size:11px;opacity:.9;font-weight:600}
.iuran-info .amount{font-size:22px;font-weight:800;margin-top:4px}
.iuran-icon{position:relative;z-index:1;font-size:48px;opacity:.9}

/* SECTION */
.section-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-header h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-header .badge-count{background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.section-header .link{font-size:12px;color:var(--p);font-weight:700;cursor:pointer}

/* CARDS */
.announcement-card{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:all .2s}
.announcement-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:#C4B5FD}
.announcement-card .ann-icon{width:40px;height:40px;border-radius:10px;background:var(--pt);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.announcement-card .ann-content{flex:1;min-width:0}
.announcement-card .ann-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
.announcement-card .ann-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.announcement-card .ann-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}

/* BOTTOM NAVIGATION MOBILE */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;color:var(--muted);font-size:10px;font-weight:600;transition:all .2s;position:relative}
.nav-item.active{color:var(--p)}
.nav-item .nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav-item .nav-badge{position:absolute;top:2px;right:50%;transform:translateX(12px);background:var(--red);color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* LOGIN PAGE */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B5CF6,#6D28D9,#5B21B6);padding:20px}
.login-container{background:#fff;border-radius:24px;padding:36px 24px;max-width:400px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.login-logo{width:80px;height:80px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-logo svg{width:44px;height:44px;color:#fff}
.login-header{text-align:center;margin-bottom:24px}
.login-header h1{font-size:22px;font-weight:800}
.login-header p{color:var(--muted);font-size:13px;margin-top:4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group select,.form-group input,.form-group textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:14px;background:#fff;color:var(--ink)}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--p)}
.btn{padding:12px 18px;border:none;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;width:100%;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:0 8px 18px rgba(109,40,217,.3)}
.btn-danger{background:var(--red);color:#fff}
.btn-secondary{background:var(--line2);color:var(--ink2)}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:8px 12px;font-size:11px;width:auto}
.login-footer{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.login-footer b{color:var(--pd)}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--pd);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:4000;opacity:0;transition:all .3s;max-width:90vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}.toast.info{background:var(--blue)}

/* LOADING */
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5000;flex-direction:column}
.spinner{width:44px;height:44px;border:4px solid var(--pt);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* SYNC STATUS */
.sync-status{position:fixed;bottom:80px;right:12px;background:#fff;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;gap:6px;z-index:99}
.sync-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

/* BADGE */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-green{background:#D1FAE5;color:#065F46}
.b-yellow{background:#FEF3C7;color:#92400E}
.b-red{background:#FEE2E2;color:#991B1B}
.b-blue{background:#DBEAFE;color:#1E40AF}

/* PAGE SECTIONS */
.page-section{padding:16px 0}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-header button{width:40px;height:40px;border-radius:12px;background:var(--pt);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.page-header h2{font-size:20px;font-weight:800}

/* RESPONSIVE */
@media(max-width:1024px){
  .desktop-layout{display:none}
  .mobile-app{display:block}
  .bottom-nav{display:block}
}

@media(min-width:1025px){
  .mobile-app{display:none}
  .bottom-nav{display:none}
  .desktop-layout{display:grid}
  .content-area{padding:24px 28px}
  
  /* Desktop stats grid */
  .stats-row{grid-template-columns:repeat(4,1fr);gap:16px}
  .stat-card .stat-value{font-size:24px}
  
  /* Desktop chart */
  .chart-card{padding:24px}
  .bar-chart{height:200px}
  .bar{width:20px}
  
  /* Desktop cards grid */
  .cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  
  /* Desktop iuran banner */
  .iuran-banner{padding:20px}
  .iuran-info .amount{font-size:28px}
}

@media(max-width:768px){
  .stats-row{grid-template-columns:1fr 1fr}
  .cards-grid{grid-template-columns:1fr}
  .content-area{padding:16px}
}

@media(max-width:480px){
  .stats-row{grid-template-columns:1fr}
  .stat-card .stat-value{font-size:18px}
  .chart-header{flex-direction:column;align-items:flex-start}
  .chart-nav{width:100%;justify-content:space-between}
}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-page" id="loginPage" style="display:none">
  <div class="login-container">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="login-header"><h1>Portal Saung Kebun</h1><p>RT 11 / RW 44</p></div>
    <div class="form-group"><label>Pilih Akun</label><select id="loginWarga"><option value="">— Memuat —</option></select></div>
    <div class="form-group"><label>PIN (4 digit)</label><input type="password" id="loginPin" placeholder="Masukkan PIN" maxlength="4" inputmode="numeric"></div>
    <button class="btn btn-primary" onclick="doLogin()">Masuk ke Portal</button>
    <button class="btn btn-danger" style="margin-top:10px" onclick="resetData()">Reset Data</button>
    <button class="btn btn-secondary" style="margin-top:10px" onclick="showHelp()">Bantuan</button>
    <div class="login-footer">PIN default: <b>1234</b></div>
  </div>
</div>

<!-- DESKTOP LAYOUT -->
<div class="desktop-layout" id="desktopLayout" style="display:none">
  <!-- Sidebar -->
  <div class="sidebar-desktop">
    <div class="sidebar-header">
      <h2><span class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> Saung Kebun</h2>
      <p>RT 11 / RW 44</p>
    </div>
    <div class="sidebar-menu" id="sidebarMenu"></div>
  </div>

  <!-- Main Content -->
  <div class="main-desktop">
    <!-- Header -->
    <div class="header-desktop">
      <div class="header-left">
        <div class="user-avatar-desktop" id="userAvatarDesktop">DR</div>
        <div class="user-info-desktop">
          <h2 id="userGreetingDesktop">Hallo, Dirham</h2>
          <p>Saung Kebun · RT 11 / RW 44</p>
        </div>
      </div>
      <div class="header-right">
        <button class="notif-btn-desktop" onclick="showNotif()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge" id="notifBadgeDesktop">0</span>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="content-area" id="desktopContent"></div>
  </div>
</div>

<!-- MOBILE APP -->
<div class="mobile-app" id="mobileApp" style="display:none">
  <!-- Header -->
  <div class="app-header">
    <div class="header-top">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">DR</div>
        <div class="user-greeting">
          <h2 id="userGreeting">Hallo, Dirham</h2>
          <p>Saung Kebun · RT 11 / RW 44</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="showNotif()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge" id="notifBadge">0</span>
        </button>
      </div>
    </div>
    <div class="header-location">
      <h1>Selamat Datang</h1>
      <p>Portal Informasi Warga RT 11 RW 44</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mobileContent"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-item active" data-page="home" onclick="showPage('home')">
        <span class="nav-icon">🏠</span>
        <span>Beranda</span>
      </button>
      <button class="nav-item" data-page="setoran" onclick="showPage('setoran')">
        <span class="nav-icon">💳</span>
        <span>Tagihan</span>
      </button>
      <button class="nav-item" data-page="iuran" onclick="showPage('iuran')">

function renderDesktopChart(){
  const kas=appData.kas||[];
  const year=currentMonth.getFullYear();
  const month=currentMonth.getMonth();
  $('chartMonthDesktop').textContent=BULAN[month]+' '+year;
  
  const monthKey=year+'-'+String(month+1).padStart(2,'0');
  const transactions=kas.filter(k=>k.tgl&&k.tgl.startsWith(monthKey));
  
  const weeks=[
    {label:'1-7',income:0,expense:0},
    {label:'8-14',income:0,expense:0},
    {label:'15-21',income:0,expense:0},
    {label:'22-28',income:0,expense:0},
    {label:'29-31',income:0,expense:0}
  ];
  
  transactions.forEach(k=>{
    const day=parseInt(k.tgl.split('-')[2]);
    let weekIdx=0;
    if(day>=8&&day<=14)weekIdx=1;
    else if(day>=15&&day<=21)weekIdx=2;
    else if(day>=22&&day<=28)weekIdx=3;
    else if(day>=29)weekIdx=4;
    if(k.tipe==='Masuk')weeks[weekIdx].income+=k.nominal;
    else weeks[weekIdx].expense+=k.nominal;
  });
  
  const maxVal=Math.max(...weeks.map(w=>Math.max(w.income,w.expense)),100000);
  
  $('barChartDesktop').innerHTML=weeks.map(w=>{
    const incomeH=Math.max((w.income/maxVal)*170,4);
    const expenseH=Math.max((w.expense/maxVal)*170,4);
    return `
      <div class="bar-group">
        <div class="bar-pair">
          <div class="bar income" style="height:${incomeH}px" title="Pemasukan: ${rp(w.income)}"></div>
          <div class="bar expense" style="height:${expenseH}px" title="Pengeluaran: ${rp(w.expense)}"></div>
        </div>
        <div class="bar-label">${w.label}</div>
      </div>
    `;
  }).join('');
}

async function toggleIuran(wid,b,nom){
  const l=appData.iuran||[];
  const i=l.findIndex(x=>x.wargaId===wid&&x.bulan===b);
  if(i>-1){l[i]={...l[i],status:'Lunas',tgl:today()};}
  else l.push({id:uid('I'),wargaId:wid,bulan:b,nominal:nom,status:'Lunas',tgl:today()});
  appData.iuran=l;
  await saveDataToFirebase();
  showToast('Iuran dilunasi');
  renderDesktopIuran();
}

function renderMobileChart(){
  const kas=appData.kas||[];
  const year=currentMonth.getFullYear();
  const month=currentMonth.getMonth();
  $('chartMonth').textContent=BULAN[month]+' '+year;
  
  const monthKey=year+'-'+String(month+1).padStart(2,'0');
  const transactions=kas.filter(k=>k.tgl&&k.tgl.startsWith(monthKey));
  
  const weeks=[
    {label:'1-7',income:0,expense:0},
    {label:'8-14',income:0,expense:0},
    {label:'15-21',income:0,expense:0},
    {label:'22-28',income:0,expense:0},
    {label:'29-31',income:0,expense:0}
  ];
  
  transactions.forEach(k=>{
    const day=parseInt(k.tgl.split('-')[2]);
    let weekIdx=0;
    if(day>=8&&day<=14)weekIdx=1;
    else if(day>=15&&day<=21)weekIdx=2;
    else if(day>=22&&day<=28)weekIdx=3;
    else if(day>=29)weekIdx=4;
    if(k.tipe==='Masuk')weeks[weekIdx].income+=k.nominal;
    else weeks[weekIdx].expense+=k.nominal;
  });
  
  const maxVal=Math.max(...weeks.map(w=>Math.max(w.income,w.expense)),100000);
  
  $('barChart').innerHTML=weeks.map(w=>{
    const incomeH=Math.max((w.income/maxVal)*130,4);
    const expenseH=Math.max((w.expense/maxVal)*130,4);
    return `
      <div class="bar-group">
        <div class="bar-pair">
          <div class="bar income" style="height:${incomeH}px" title="Pemasukan: ${rp(w.income)}"></div>
          <div class="bar expense" style="height:${expenseH}px" title="Pengeluaran: ${rp(w.expense)}"></div>
        </div>
        <div class="bar-label">${w.label}</div>
      </div>
    `;
  }).join('');
}

  const bulan=$('setorBulan').value,nominal=parseInt($('setorNominal').value),metode=$('setorMetode').value,ref=$('setorRef').value.trim(),catatan=$('setorCatatan').value.trim();
  if(!nominal||nominal<1000)return showToast('Nominal min 1000','error');
  const l=appData.setoran||[];
  l.unshift({id:uid('S'),wargaId:currentUser.id,namaWarga:currentUser.nama,blok:currentUser.blok,bulan,nominal,metode,ref,catatan,bukti:[],status:'Pending',tglSetor:today(),tglKonfirmasi:null,dikonfirmasiOleh:null,alasan:''});
  appData.setoran=l;
  await saveDataToFirebase();
  showToast('Setoran terkirim');
  $('setorRef').value='';$('setorCatatan').value='';
  renderMobileSetoran();
}

function renderMobilePengaduan(){
  const l=(appData.lapor||[]).slice().sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));
  $('mobileContent').innerHTML=`
    <div class="page-section">
      <div class="page-header">
        <button onclick="showPage('home')">←</button>
        <h2>Pengaduan</h2>
      </div>
      <button class="btn btn-primary" style="margin-bottom:16px" onclick="showLaporForm()">＋ Lapor Masalah</button>
      ${l.length?l.map(x=>{
        const w=appData.warga.find(v=>v.id===x.wargaId);
        const bc=x.status==='Selesai'?'b-green':x.status==='Diproses'?'b-blue':x.status==='Ditolak'?'b-red':'b-yellow';
        return `<div class="announcement-card">
          <div class="ann-icon" style="background:#FEE2E2">⚠️</div>
          <div class="ann-content">
            <div class="ann-title">${esc(x.judul)} <span class="badge ${bc}">${esc(x.status)}</span></div>
            <div class="ann-meta"><span>${esc(x.kat)}</span><span class="dot"></span><span>${esc(w?w.nama:'Warga')}</span><span class="dot"></span><span>${tglIndo(x.tgl)}</span></div>
            <div style="font-size:12px;color:var(--ink2);margin-top:6px">${esc(x.isi)}</div>
          </div>
        </div>`;
      }).join(''):'<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">⚠️</div><p>Belum ada pengaduan</p></div>'}
    </div>
  `;
}

function showLaporForm(){
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML=`
    <div style="background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto">
      <div style="width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px"></div>
      <h3 style="font-size:18px;font-weight:800;margin-bottom:16px">🚨 Lapor Masalah</h3>
      <div class="form-group"><label>Kategori</label><select id="lKat"><option>Infrastruktur</option><option>Keamanan</option><option>Kebersihan</option><option>Sosial</option><option>Penerangan</option><option>Lainnya</option></select></div>
      <div class="form-group"><label>Prioritas</label><select id="lPrio"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option><option>Darurat</option></select></div>
      <div class="form-group"><label>Judul *</label><input id="lJudul" placeholder="Judul laporan"></div>
      <div class="form-group"><label>Deskripsi *</label><textarea id="lIsi" rows="3" placeholder="Deskripsi masalah"></textarea></div>
      <button class="btn btn-primary" onclick="saveLaporFromModal()">📤 Kirim Laporan</button>
      <button class="btn btn-secondary" style="margin-top:8px" onclick="this.closest('div[style]').remove()">Batal</button>
    </div>
  `;
  document.body.appendChild(modal);
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
}

async function saveLaporFromModal(){
  const kat=$('lKat').value,prio=$('lPrio').value,judul=$('lJudul').value.trim(),isi=$('lIsi').value.trim();
  if(!judul||!isi)return showToast('Lengkapi field','error');
  const l=appData.lapor||[];
  l.unshift({id:uid('L'),wargaId:currentUser.id,kat,prio,judul,isi,status:'Baru',tgl:today()});
  appData.lapor=l;
  await saveDataToFirebase();
  document.querySelector('.modal')?.remove();
  showToast('Laporan terkirim');
  renderMobilePengaduan();
}

function renderMobileRonda(){
  const l=(appData.ronda||[]).slice().sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||''));
  $('mobileContent').innerHTML=`
    <div class="page-section">
      <div class="page-header">
        <button onclick="showPage('home')">←</button>
        <h2>Jadwal Ronda</h2>
      </div>
      ${l.length?l.map(r=>`
        <div class="announcement-card">
          <div class="ann-icon" style="background:#E0E7FF">🛡️</div>
          <div class="ann-content">
            <div class="ann-title">${esc(r.shift)} · ${esc(r.waktu||'-')}</div>
            <div class="ann-meta"><span>📅 ${tglIndo(r.tgl)}</span><span class="dot"></span><span>👤 ${esc(r.petugas)}</span></div>

    </div>
  `;
}

  const l=(appData.pengumuman||[]).slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0));
  $('mobileContent').innerHTML=`
    <div class="page-section">
      <div class="page-header">
        <button onclick="showPage('home')">←</button>
        <h2>Pengumuman</h2>
      </div>
      ${l.length?l.map(p=>`
        <div class="announcement-card">
          <div class="ann-icon" style="background:#EDE9FE">📢</div>

            <div class="ann-title">${esc(p.judul)} ${p.pin?'📌':''}</div>
            <div style="font-size:12px;color:var(--ink2);margin:6px 0">${esc(p.isi)}</div>
            <div class="ann-meta"><span>${tglIndo(p.tgl)}</span><span class="dot"></span><span>${esc(p.oleh||'')}</span></div>
          </div>
        </div>
      `).join(''):'<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">📢</div><p>Belum ada pengumuman</p></div>'}
    </div>

            <div class="ann-meta"><span>📅 ${tglIndo(k.tgl)}</span><span class="dot"></span><span> ${esc(k.waktuMulai||'-')}</span></div>
            <div style="font-size:12px;color:var(--ink2);margin-top:6px">📍 ${esc(k.lokasi||'-')} · 👤 ${esc(k.penanggungJawab||'-')}</div>
          </div>
        </div>
      `).join(''):'<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">📅</div><p>Tidak ada kegiatan</p></div>'}
    </div>
  `;

function showNotif(){
  const pd=(appData.setoran||[]).filter(s=>s.status==='Pending').length;
  const br=(appData.lapor||[]).filter(s=>s.status==='Baru').length;
  alert(`🔔 Notifikasi:\n\n📤 ${pd} setoran menunggu\n⚠️ ${br} pengaduan baru`);
}

// Handle resize
window.addEventListener('resize',()=>{
  if(currentUser){
    const isDesktop=window.innerWidth>=1025;
    if(isDesktop&&$('mobileApp').style.display==='block'){
      $('mobileApp').style.display='none';
      $('desktopLayout').style.display='grid';
      $('userAvatarDesktop').textContent=initials(currentUser.nama);
      $('userGreetingDesktop').textContent='Hallo, '+currentUser.nama.split(' ')[0];
      buildSidebarMenu();
      renderDesktopDashboard();
    }else if(!isDesktop&&$('desktopLayout').style.display==='grid'){
      $('desktopLayout').style.display='none';
      $('mobileApp').style.display='block';
      $('userAvatar').textContent=initials(currentUser.nama);
      $('userGreeting').textContent='Hallo, '+currentUser.nama.split(' ')[0];
      renderMobileDashboard();
    }
  }
});

(async function init(){
  await loadDataFromFirebase();
  normalize();
  populateLoginWarga();
  $('loading').style.display='none';
  const s=localStorage.getItem('rtku_sess');
  if(s){
    try{
      const d=JSON.parse(s);
      const w=(appData.warga||[]).find(x=>x.id===d.id);
      if(w&&Date.now()-d.t<7*864e5){currentUser=w;enterApp();showToast('Selamat datang kembali!','info');return;}
    }catch(e){}
  }
  $('loginPage').style.display='flex';
})();

window.addEventListener('online',()=>updateSyncStatus(true));
window.addEventListener('offline',()=>updateSyncStatus(false));
</script>
