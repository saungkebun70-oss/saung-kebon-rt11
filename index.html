<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Saung Kebun RT 11 RW 44</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#7C3AED;--pd:#6D28D9;--pdd:#5B21B6;--pt:#EDE9FE;--pt2:#F5F3FF;--ink:#1F2937;--ink2:#374151;--muted:#6B7280;--muted2:#9CA3AF;--line:#E5E7EB;--line2:#F3F4F6;--bg:#F8F9FC;--card:#fff;--green:#10B981;--red:#EF4444;--blue:#3B82F6;--orange:#F97316;--sbw:260px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#C4B5FD;border-radius:8px}

/* SVG ICONS */
.svg-icon{width:22px;height:22px;flex-shrink:0;display:inline-block;vertical-align:middle}
.svg-icon-sm{width:18px;height:18px}
.svg-icon-lg{width:28px;height:28px}

/* DESKTOP LAYOUT */
.desktop-layout{display:grid;grid-template-columns:var(--sbw) 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar-desktop{background:#fff;border-right:1px solid var(--line);position:fixed;left:0;top:0;bottom:0;width:var(--sbw);overflow-y:auto;z-index:50}
.sidebar-header{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.sidebar-header .logo-wrap{width:40px;height:40px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-header .logo-wrap svg{width:24px;height:24px;color:#fff}
.sidebar-header .logo-text h2{font-size:16px;font-weight:800;color:var(--ink)}
.sidebar-header .logo-text p{font-size:11px;color:var(--muted);margin-top:2px}
.sidebar-menu{padding:12px 10px 20px;display:flex;flex-direction:column;gap:4px}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:all .15s;border-radius:10px}
.menu-item:hover{background:var(--pt2);color:var(--ink)}
.menu-item.active{background:var(--pt);color:var(--pdd)}
.menu-item .icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-item .icon-wrap svg{width:20px;height:20px}
.menu-item.logout-item{color:var(--red);margin-top:8px;border-top:1px solid var(--line);padding-top:16px}
.menu-item.logout-item:hover{background:#FEF2F2}

/* MAIN CONTENT */
.main-desktop{margin-left:var(--sbw);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.header-desktop{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.header-left{display:flex;align-items:center;gap:16px}
.user-avatar-desktop{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.user-info-desktop h2{font-size:16px;font-weight:700;color:var(--ink)}
.user-info-desktop p{font-size:12px;color:var(--muted);margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.notif-btn-desktop{width:42px;height:42px;background:var(--pt);border:none;border-radius:12px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;color:var(--p)}
.notif-btn-desktop svg{width:20px;height:20px}
.notif-btn-desktop .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.notif-btn-desktop .badge.show{display:flex}

/* CONTENT AREA */
.content-area{padding:24px 28px;flex:1;max-width:1400px;width:100%;margin:0 auto}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid var(--line);transition:all .2s}
.stat-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.stat-card .stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-card .stat-icon svg{width:22px;height:22px}
.stat-card .stat-icon.blue{background:#DBEAFE;color:var(--blue)}
.stat-card .stat-icon.green{background:#D1FAE5;color:var(--green)}
.stat-card .stat-icon.red{background:#FEE2E2;color:var(--red)}
.stat-card .stat-icon.orange{background:#FEF3C7;color:var(--orange)}
.stat-card .stat-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .stat-value{font-size:22px;font-weight:800;color:var(--ink)}

/* CHART CARD */
.chart-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid var(--line);margin-bottom:24px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.chart-header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.chart-nav{display:flex;align-items:center;gap:12px}
.chart-nav button{width:36px;height:36px;border-radius:10px;background:var(--pt);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s}
.chart-nav button:hover{background:var(--p);color:#fff}
.chart-nav span{font-size:15px;font-weight:700;min-width:140px;text-align:center}

/* BAR CHART */
.bar-chart-container{position:relative;height:220px;padding:20px 0 40px}
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;height:180px;position:relative}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;max-width:80px}
.bar-pair{display:flex;gap:6px;align-items:flex-end;height:160px}
.bar{width:20px;border-radius:6px 6px 0 0;transition:all .3s;position:relative;cursor:pointer}
.bar.income{background:linear-gradient(180deg,var(--blue),#2563EB)}
.bar.expense{background:linear-gradient(180deg,var(--ink),#111827)}
.bar:hover{opacity:.8;transform:scaleX(1.1)}
.bar-label{font-size:11px;color:var(--muted);font-weight:600}

.chart-legend{display:flex;justify-content:center;gap:24px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.legend-dot{width:12px;height:12px;border-radius:4px}
.legend-dot.income{background:var(--blue)}
.legend-dot.expense{background:var(--ink)}

/* IURAN BANNER */
.iuran-banner{background:linear-gradient(135deg,#F97316,#EA580C);border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:space-between;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(249,115,22,.3);cursor:pointer;transition:all .2s;margin-bottom:24px}
.iuran-banner:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(249,115,22,.4)}
.iuran-banner::before{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:rgba(255,255,255,.1);border-radius:50%}
.iuran-banner::after{content:"";position:absolute;right:30px;bottom:-40px;width:100px;height:100px;background:rgba(255,255,255,.08);border-radius:50%}
.iuran-info{position:relative;z-index:1}
.iuran-info .label{font-size:12px;opacity:.9;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.iuran-info .amount{font-size:28px;font-weight:800;margin-top:6px}
.iuran-icon{position:relative;z-index:1;font-size:56px;opacity:.9}

/* SECTION */
.section-header{display:flex;justify-content:space-between;align-items:center;margin:24px 0 16px}
.section-header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-header .badge-count{background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.section-header .link{font-size:13px;color:var(--p);font-weight:700;cursor:pointer}
.section-header .link:hover{text-decoration:underline}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}

/* ANNOUNCEMENT CARD */
.announcement-card{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--line);margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:all .2s}
.announcement-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:#C4B5FD;transform:translateY(-1px)}
.announcement-card .ann-icon{width:44px;height:44px;border-radius:12px;background:var(--pt);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.announcement-card .ann-content{flex:1;min-width:0}
.announcement-card .ann-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.announcement-card .ann-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.announcement-card .ann-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}

/* BADGE */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-green{background:#D1FAE5;color:#065F46}
.b-yellow{background:#FEF3C7;color:#92400E}
.b-red{background:#FEE2E2;color:#991B1B}
.b-blue{background:#DBEAFE;color:#1E40AF}
.b-purple{background:var(--pt);color:var(--pdd)}

/* PAGE HEADER */
.page-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.page-header button{width:42px;height:42px;border-radius:12px;background:var(--pt);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .2s}
.page-header button:hover{background:var(--p);color:#fff}
.page-header h2{font-size:22px;font-weight:800}

/* LOGIN PAGE */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B5CF6,#6D28D9,#5B21B6);padding:20px}
.login-container{background:#fff;border-radius:24px;padding:40px 32px;max-width:420px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.login-logo{width:84px;height:84px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.login-logo svg{width:48px;height:48px;color:#fff}
.login-header{text-align:center;margin-bottom:28px}
.login-header h1{font-size:24px;font-weight:800}
.login-header p{color:var(--muted);font-size:13px;margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group select,.form-group input,.form-group textarea{width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:12px;font-size:14px;background:#fff;color:var(--ink)}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--p)}
.btn{padding:13px 20px;border:none;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;width:100%;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:0 8px 18px rgba(109,40,217,.3)}
.btn-primary:hover{box-shadow:0 12px 24px rgba(109,40,217,.4)}
.btn-danger{background:var(--red);color:#fff}
.btn-secondary{background:var(--line2);color:var(--ink2)}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;width:auto}
.login-footer{text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.login-footer b{color:var(--pd)}

/* TOAST */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--pd);color:#fff;padding:14px 24px;border-radius:14px;font-size:14px;font-weight:700;z-index:4000;opacity:0;transition:all .3s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}.toast.info{background:var(--blue)}

/* LOADING */
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5000;flex-direction:column}
.spinner{width:48px;height:48px;border:4px solid var(--pt);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* SYNC STATUS */
.sync-status{position:fixed;bottom:24px;right:24px;background:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;z-index:99}
.sync-status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}

/* MOBILE APP */
.mobile-app{display:none;max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;overflow:hidden}

.app-header{position:relative;height:180px;background:linear-gradient(135deg,rgba(124,58,237,.9),rgba(109,40,217,.95));overflow:hidden}
.app-header::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.3))}
.header-top{position:relative;z-index:2;padding:16px;display:flex;justify-content:space-between;align-items:center}
.user-info{display:flex;align-items:center;gap:12px}
.user-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.user-greeting h2{color:#fff;font-size:16px;font-weight:700}
.user-greeting p{color:rgba(255,255,255,.9);font-size:12px;margin-top:2px}
.header-actions{display:flex;gap:8px}
.header-btn{width:40px;height:40px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;cursor:pointer}
.header-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.header-location{position:absolute;bottom:16px;left:16px;right:16px;z-index:2;color:#fff}
.header-location h1{font-size:22px;font-weight:800}
.header-location p{font-size:12px;opacity:.9;margin-top:4px}

.main-content{padding:16px;padding-bottom:100px}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-40px;position:relative;z-index:3}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;color:var(--muted);font-size:10px;font-weight:600;transition:all .2s;position:relative}
.nav-item.active{color:var(--p)}
.nav-item .nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav-item .nav-badge{position:absolute;top:2px;right:50%;transform:translateX(12px);background:var(--red);color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* RESPONSIVE */
@media(max-width:1024px){
  .desktop-layout{display:none}
  .mobile-app{display:block}
  .bottom-nav{display:block}
  .stats-row{grid-template-columns:1fr 1fr}
}

@media(min-width:1025px){
  .mobile-app{display:none}
  .bottom-nav{display:none}
  .desktop-layout{display:grid}
}

@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .cards-grid{grid-template-columns:1fr}
  .content-area{padding:16px}
}

@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .stat-card .stat-value{font-size:18px}
  .chart-header{flex-direction:column;align-items:flex-start;gap:12px}
  .chart-nav{width:100%;justify-content:space-between}
}
</style>
</head>

async function loadDataFromFirebase(){
  try{
    const snapshot=await db.ref('/').once('value');
    const data=snapshot.val();
    if(data&&data.warga&&data.warga.length){appData=data;showToast('Data dimuat','info');}
    else{await db.ref('/').set(defaultData);appData=JSON.parse(JSON.stringify(defaultData));showToast('Data default dibuat','info');}
    updateSyncStatus(true);
  }catch(e){
    console.error(e);
    try{const local=localStorage.getItem('saungkebon_cache');if(local){appData=JSON.parse(local);showToast('Cache lokal','info');}else{appData=JSON.parse(JSON.stringify(defaultData));}}
    catch(e2){appData=JSON.parse(JSON.stringify(defaultData));}
    updateSyncStatus(false);
  }
}

async function saveDataToFirebase(){
  try{await db.ref('/').set(appData);localStorage.setItem('saungkebon_cache',JSON.stringify(appData));updateSyncStatus(true);}
  catch(e){localStorage.setItem('saungkebon_cache',JSON.stringify(appData));updateSyncStatus(false);showToast('Cache lokal','info');}
}

  if(!Array.isArray(appData.warga))appData.warga=[];
  appData.warga.forEach(w=>{if(!w.pin)w.pin='1234';});
  ['iuran','kas','setoran','pengumuman','kegiatan','lapor','tamu','surat','voting','ronda'].forEach(k=>{if(!Array.isArray(appData[k]))appData[k]=[];});
};

function doLogin(){
  const id=$('loginWarga').value,pin=$('loginPin').value.trim();
  if(!id)return showToast('Pilih akun','error');
  if(!/^\d{4}$/.test(pin))return showToast('PIN 4 digit','error');
  const w=appData.warga.find(x=>x.id===id);
  if(!w)return showToast('Akun tidak ada','error');
  if(pin!==(w.pin||'1234'))return showToast('PIN salah!','error');
  currentUser=w;
  localStorage.setItem('rtku_sess',JSON.stringify({id:w.id,t:Date.now()}));
  enterApp();
  showToast('Selamat datang, '+w.nama.split(' ')[0]+'!');
}

function renderDesktopChart(){
  const kas=appData.kas||[];
  const year=currentMonth.getFullYear();
  const month=currentMonth.getMonth();
  $('chartMonthDesktop').textContent=BULAN[month]+' '+year;
  
  const monthKey=year+'-'+String(month+1).padStart(2,'0');
  const transactions=kas.filter(k=>k.tgl&&k.tgl.startsWith(monthKey));
  
  const weeks=[
    {label:'1-7',income:0,expense:0},
    {label:'8-14',income:0,expense:0},
    {label:'15-21',income:0,expense:0},
    {label:'22-28',income:0,expense:0},
    {label:'29-31',income:0,expense:0}
  ];
  
  transactions.forEach(k=>{
    const day=parseInt(k.tgl.split('-')[2]);
    let weekIdx=0;
    if(day>=8&&day<=14)weekIdx=1;
    else if(day>=15&&day<=21)weekIdx=2;
    else if(day>=22&&day<=28)weekIdx=3;
    else if(day>=29)weekIdx=4;
    if(k.tipe==='Masuk')weeks[weekIdx].income+=k.nominal;
    else weeks[weekIdx].expense+=k.nominal;
  });
  
  const maxVal=Math.max(...weeks.map(w=>Math.max(w.income,w.expense)),100000);
  
  $('barChartDesktop').innerHTML=weeks.map(w=>{
    const incomeH=Math.max((w.income/maxVal)*150,4);
    const expenseH=Math.max((w.expense/maxVal)*150,4);
    return `
      <div class="bar-group">
        <div class="bar-pair">
          <div class="bar income" style="height:${incomeH}px" title="Pemasukan: ${rp(w.income)}"></div>
          <div class="bar expense" style="height:${expenseH}px" title="Pengeluaran: ${rp(w.expense)}"></div>
        </div>
        <div class="bar-label">${w.label}</div>
      </div>
    `;
  }).join('');
}

function changeMonth(delta){
  currentMonth.setMonth(currentMonth.getMonth()+delta);
  const isDesktop=window.innerWidth>=1025;
  if(isDesktop)renderDesktopChart();
  else renderMobileChart();
}

function renderMobileChart(){
  const kas=appData.kas||[];
  const year=currentMonth.getFullYear();
  const month=currentMonth.getMonth();
  $('chartMonth').textContent=BULAN[month]+' '+year;
  
  const monthKey=year+'-'+String(month+1).padStart(2,'0');
  const transactions=kas.filter(k=>k.tgl&&k.tgl.startsWith(monthKey));
  
  const weeks=[{label:'1-7',income:0,expense:0},{label:'8-14',income:0,expense:0},{label:'15-21',income:0,expense:0},{label:'22-28',income:0,expense:0},{label:'29-31',income:0,expense:0}];
  
  transactions.forEach(k=>{
    const day=parseInt(k.tgl.split('-')[2]);
    let weekIdx=0;
    if(day>=8&&day<=14)weekIdx=1;
    else if(day>=15&&day<=21)weekIdx=2;
    else if(day>=22&&day<=28)weekIdx=3;
    else if(day>=29)weekIdx=4;
    if(k.tipe==='Masuk')weeks[weekIdx].income+=k.nominal;
    else weeks[weekIdx].expense+=k.nominal;
  });
  
  const maxVal=Math.max(...weeks.map(w=>Math.max(w.income,w.expense)),100000);
  
  $('barChart').innerHTML=weeks.map(w=>{
    const incomeH=Math.max((w.income/maxVal)*130,4);
    const expenseH=Math.max((w.expense/maxVal)*130,4);
    return `<div class="bar-group"><div class="bar-pair"><div class="bar income" style="height:${incomeH}px"></div><div class="bar expense" style="height:${expenseH}px"></div></div><div class="bar-label">${w.label}</div></div>`;
  }).join('');
}

function renderMobileIuran(){
  const b=bulanIni();const nom=appData.rt.iuranNominal||50000;const m={};
  (appData.iuran||[]).filter(i=>i.bulan===b).forEach(i=>m[i.wargaId]=i);
  const l=appData.warga||[];const ln=l.filter(w=>m[w.id]&&m[w.id].status==='Lunas').length;
  const pct=l.length?Math.round(ln/l.length*100):0;
  
  $('mobileContent').innerHTML=`<div class="page-section"><div class="page-header"><button onclick="showPage('home')">←</button><h2>Status Iuran</h2></div><div class="chart-card"><div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:8px">Progress Bulan Ini</div><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:28px;font-weight:800">${ln}/${l.length}</div><div style="font-size:13px;color:var(--muted)">${rp(nom)}/warga</div></div><div style="height:8px;background:var(--line2);border-radius:4px;margin-top:12px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,var(--green),#059669);width:${pct}%"></div></div></div>${l.map(w=>{const r=m[w.id],ok=r&&r.status==='Lunas';return `<div class="announcement-card" style="${ok?'border-color:#BBF7D0;background:#F0FDF4':''}"><div class="ann-icon" style="background:${ok?'#D1FAE5':'var(--pt)'}">${ok?'✅':'⏳'}</div><div class="ann-content"><div class="ann-title">${esc(w.nama)} <span style="font-size:11px;color:var(--muted)">(${esc(w.blok)})</span></div><div class="ann-meta">${ok?'Lunas '+tglIndo(r.tgl):'Belum membayar'}</div></div>${!ok&&isStaff()?`<button class="btn btn-success btn-sm" onclick="toggleIuran('${w.id}','${b}',${nom})">Lunas</button>`:''}</div>`;}).join('')}</div>`;

function renderMobileSetoran(){
  $('mobileContent').innerHTML=`<div class="page-section"><div class="page-header"><button onclick="showPage('home')">←</button><h2>Setoran Iuran</h2></div><div class="chart-card"><div class="form-group"><label>Bulan</label><select id="setorBulan"></select></div><div class="form-group"><label>Nominal</label><input type="number" id="setorNominal" value="${appData.rt.iuranNominal||50000}"></div><div class="form-group"><label>Metode</label><select id="setorMetode"><option>Transfer Bank</option><option>E-Wallet</option><option>QRIS</option><option>Tunai</option></select></div><div class="form-group"><label>No. Referensi</label><input type="text" id="setorRef" placeholder="TRX..."></div><div class="form-group"><label>Catatan</label><textarea id="setorCatatan" rows="2"></textarea></div><button class="btn btn-primary" onclick="submitSetoran()">Kirim Setoran</button></div><div class="section-header"><h3>📋 Riwayat Saya</h3></div><div id="riwayatList"></div></div>`;
  const s=new Set([bulanIni()]);const d=new Date();for(let i=-2;i<6;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1);s.add(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));}
  $('setorBulan').innerHTML=[...s].sort().reverse().map(b=>`<option value="${b}" ${b===bulanIni()?'selected':''}>${labelBulan(b)}</option>`).join('');
  const mine=(appData.setoran||[]).filter(s=>s.wargaId===currentUser.id);
  $('riwayatList').innerHTML=mine.length?mine.map(s=>{const bc=s.status==='Pending'?'b-yellow':s.status==='Dikonfirmasi'?'b-green':'b-red';return `<div class="announcement-card"><div class="ann-icon" style="background:${s.status==='Dikonfirmasi'?'#D1FAE5':s.status==='Pending'?'#FEF3C7':'#FEE2E2'}">${s.status==='Dikonfirmasi'?'✅':s.status==='Pending'?'⏳':''}</div><div class="ann-content"><div class="ann-title">${labelBulan(s.bulan)} · ${rp(s.nominal)}</div><div class="ann-meta"><span class="badge ${bc}">${s.status}</span><span class="dot"></span><span>${tglIndo(s.tglSetor)}</span></div></div></div>`;}).join(''):'<div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px">Belum pernah setor</div>';
}

async function submitSetoran(){
  const bulan=$('setorBulan').value,nominal=parseInt($('setorNominal').value),metode=$('setorMetode').value,ref=$('setorRef').value.trim(),catatan=$('setorCatatan').value.trim();
  if(!nominal||nominal<1000)return showToast('Nominal min 1000','error');
  const l=appData.setoran||[];
  l.unshift({id:uid('S'),wargaId:currentUser.id,namaWarga:currentUser.nama,blok:currentUser.blok,bulan,nominal,metode,ref,catatan,bukti:[],status:'Pending',tglSetor:today(),tglKonfirmasi:null,dikonfirmasiOleh:null,alasan:''});
  appData.setoran=l;
  await saveDataToFirebase();
  showToast('Setoran terkirim');
  $('setorRef').value='';$('setorCatatan').value='';
  renderMobileSetoran();
}

function showLaporForm(){
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML=`<div style="background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto"><div style="width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px"></div><h3 style="font-size:18px;font-weight:800;margin-bottom:16px">🚨 Lapor Masalah</h3><div class="form-group"><label>Kategori</label><select id="lKat"><option>Infrastruktur</option><option>Keamanan</option><option>Kebersihan</option><option>Sosial</option><option>Penerangan</option><option>Lainnya</option></select></div><div class="form-group"><label>Prioritas</label><select id="lPrio"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option><option>Darurat</option></select></div><div class="form-group"><label>Judul *</label><input id="lJudul" placeholder="Judul laporan"></div><div class="form-group"><label>Deskripsi *</label><textarea id="lIsi" rows="3" placeholder="Deskripsi masalah"></textarea></div><button class="btn btn-primary" onclick="saveLaporFromModal()"> Kirim Laporan</button><button class="btn btn-secondary" style="margin-top:8px" onclick="this.closest('div[style]').remove()">Batal</button></div>`;
  document.body.appendChild(modal);
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
}

async function saveLaporFromModal(){
  const kat=$('lKat').value,prio=$('lPrio').value,judul=$('lJudul').value.trim(),isi=$('lIsi').value.trim();
  if(!judul||!isi)return showToast('Lengkapi field','error');
  const l=appData.lapor||[];
  l.unshift({id:uid('L'),wargaId:currentUser.id,kat,prio,judul,isi,status:'Baru',tgl:today()});
  appData.lapor=l;
  await saveDataToFirebase();
  document.querySelector('.modal')?.remove();
  showToast('Laporan terkirim');
  renderMobilePengaduan();
}

// Handle resize
window.addEventListener('resize',()=>{
  if(currentUser){
    const isDesktop=window.innerWidth>=1025;
    if(isDesktop&&$('mobileApp').style.display==='block'){
      $('mobileApp').style.display='none';
      $('desktopLayout').style.display='grid';
      $('userAvatarDesktop').textContent=initials(currentUser.nama);
      $('userGreetingDesktop').textContent='Hallo, '+currentUser.nama.split(' ')[0];
      buildSidebarMenu();
      renderDesktopDashboard();
    }else if(!isDesktop&&$('desktopLayout').style.display==='grid'){
      $('desktopLayout').style.display='none';
      $('mobileApp').style.display='block';
      $('userAvatar').textContent=initials(currentUser.nama);
      $('userGreeting').textContent='Hallo, '+currentUser.nama.split(' ')[0];
      renderMobileDashboard();
    }
  }
});

(async function init(){
  await loadDataFromFirebase();
  normalize();
  populateLoginWarga();
  $('loading').style.display='none';
  const s=localStorage.getItem('rtku_sess');
  if(s){
    try{
      const d=JSON.parse(s);
      const w=(appData.warga||[]).find(x=>x.id===d.id);
      if(w&&Date.now()-d.t<7*864e5){currentUser=w;enterApp();showToast('Selamat datang kembali!','info');return;}
    }catch(e){}
  }
  $('loginPage').style.display='flex';
})();

window.addEventListener('online',()=>updateSyncStatus(true));
window.addEventListener('offline',()=>updateSyncStatus(false));
